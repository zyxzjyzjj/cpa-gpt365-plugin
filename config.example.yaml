# GPT365 Basis Points 插件配置示例（CPA / CLIProxyAPI）
#
# 将本文件的 plugins 节点内容合并到 CPA 的 config.yaml。
# 若已有 plugins 节点，请只合并其子项，不要重复添加同名节点或覆盖其他插件。
#
# 本文件不会被插件自动读取；CPA 会把 plugins.configs.gpt365 下的参数传给插件。
#
# 动态库文件名必须与插件 ID 一致：gpt365.dll / gpt365.so / gpt365.dylib
#
# 凭据处理原则：本仓库是公开的，因此示例中不含任何真实凭据。
# 远程代理的用户名与口令请通过环境变量注入（见下方 proxy_chain 说明）。

plugins:
  # CPA 插件系统总开关；仅打开单个插件开关是不够的。
  enabled: true
  dir: "plugins"
  configs:
    gpt365:
      enabled: true
      # 启动与路由顺序，数值越大越先执行。
      priority: 100

      # ---------------------------------------------------------------------
      # 上游接口
      # ---------------------------------------------------------------------

      # Basis Points Responses 接口地址，通常无需修改。
      responses_url: https://bps.openai.com/basispoints/api/responses

      # 未在 model_mappings 中单独配置的别名使用此上游模型。
      #
      # 注意：可用模型取决于账号权限，且上游会在无权限时返回
      # 403 "Model access has changed" 或 429。默认值 gpt-5.6-luna
      # 是实测可用的保守选择；如你的账号有其他权限，可自行替换。
      upstream_model: gpt-5.6-luna

      # 暴露给客户端的模型别名列表。
      # 建议保留 -basispoints 后缀，避免与 CPA 原生 Codex 模型混淆。
      models:
        - gpt-5.6-luna-basispoints

      # 别名到上游模型的映射。键必须已列入 models。
      model_mappings:
        gpt-5.6-luna-basispoints: gpt-5.6-luna

      # 上游的 model_selection 字段，默认留空表示不发送。
      #
      # 实测：发送 "explicit" 会让上游按名称严格校验账号权限，账号没有该
      # 模型权限时直接返回 403；"auto" 会被判定为非法值返回 422。
      # 留空时上游按账号实际权限路由，兼容性最好。
      model_selection: ""

      # 读取上游响应的超时时间，单位秒，范围 10~1800。
      timeout_seconds: 300

      # 上游响应体大小上限，单位字节，范围 64 KiB ~ 128 MiB。
      max_response_bytes: 67108864

      # 认证模式，通常保持 chatgpt。
      #
      # 凭据由本插件自己管理：导入的令牌会成为 auth-dir 下 type 为 gpt365
      # 的凭据文件，由本插件的 auth provider 解析。
      #
      # 导入方式（任选其一）：
      #   1. 打开 /v0/resource/plugins/gpt365/ 页面，批量粘贴令牌
      #   2. 调用 POST /v0/management/plugins/gpt365/import
      #   3. 直接把凭据 JSON 放进 auth-dir，type 写 gpt365
      auth_mode: chatgpt

      # 非敏感配置的持久化目录。留空表示只由本文件管理配置。
      # 远程代理口令属于凭据，任何时候都不会写入该目录。
      data_dir: ""

      # ---------------------------------------------------------------------
      # 代理池：每个账号一个出口
      # ---------------------------------------------------------------------
      #
      # 多个账号共用一个出口 IP 时，上游很容易把它们关联起来并触发风控。
      # 启用代理池后，每个账号固定分配一个出口，且分配结果写进凭据，
      # 重启后依然有效。
      #
      # 与 proxy_chain 的分工：
      #   proxy_chain 决定「怎么连出去」——本机 -> 本地代理 -> 远程代理
      #   proxy_pool  决定「用哪个远程代理」——每个账号分配池中一条
      # 账号代理只替换远程段，本地代理那一跳保持不变。
      proxy_pool:
        # 关闭时所有账号共用 proxy_chain 的远程代理。
        enabled: false

        # 可用出口列表。name 用于识别，url 支持 http://user:pass@host:port。
        entries: []
          # - name: "jp-1"
          #   url: "http://USER-zone-custom-region-JP:password@global.example.com:10000"
          # - name: "jp-2"
          #   url: "http://USER-zone-custom-region-JP2:password@global.example.com:10000"

        # 账号与出口的对应方式：
        #   hash   —— 按账号 ID 稳定散列（默认）。同一账号永远同一出口，
        #             账号增减不会打乱既有分配。
        #   sticky —— 按导入顺序依次分配。
        strategy: hash

        # 为真时，池已启用但没有可用出口会让请求直接失败，
        # 而不是静默回退到 proxy_chain。
        # 用于避免「以为在隔离，其实共用出口」。
        strict: false

      # ---------------------------------------------------------------------
      # 会话粘性：同一会话固定使用同一账号
      # ---------------------------------------------------------------------
      #
      # 上游按会话组织多轮对话。若同一会话的不同轮次落到不同账号，上游会看到
      # 割裂的上下文，既影响效果，也因「同会话在不同账号/IP 间跳跃」更易触发风控。
      #
      # 插件通过 CPA 的 scheduler 能力参与选号：命中绑定则返回该账号，
      # 未命中则交给内置调度器，不与宿主自身的负载均衡冲突。
      sticky_session:
        enabled: true
        # 绑定存活秒数。超时后允许重新分配，避免长期占用单一账号。
        ttl_seconds: 3600
        # 绑定表容量上限，超出后淘汰最旧记录。
        max_entries: 4096

      # ---------------------------------------------------------------------
      # 两级代理链（全局默认）
      # ---------------------------------------------------------------------
      #
      # 本插件自行建立网络连接（不使用宿主的 HTTP 传输），因为本机访问
      # 上游需要两级隧道：
      #
      #   本进程 --CONNECT--> 本地代理 --CONNECT--> 远程轮换代理 --> 上游
      #
      # 宿主的 HTTP 传输只支持单一代理，无法在已建立的隧道内再发一次
      # CONNECT，因此必须由插件自己实现。
      #
      # 关闭本项后插件将直连上游（多数网络环境下会失败）。
      proxy_chain:
        enabled: true

        # 第一跳：本机可达的本地代理。
        # 远程轮换代理无法从本机直连，必须经此转发。
        local_proxy: "http://127.0.0.1:15732"

        # 第二跳：远程轮换代理。留空表示只使用本地代理单跳。
        # 示例：http://your-rotating-proxy.example.com:10000
        remote_proxy: ""

        # 远程代理凭据。请勿把真实口令写进本文件。
        #
        # 推荐用环境变量注入（优先级高于本文件）：
        #   GPT365_REMOTE_USERNAME
        #   GPT365_REMOTE_PASSWORD
        #   GPT365_REMOTE_PROXY
        #   GPT365_LOCAL_PROXY
        #   GPT365_RESPONSES_URL
        #   GPT365_UPSTREAM_MODEL
        remote_username: ""

        # 建立隧道（含两跳 CONNECT）的超时秒数，范围 1~300。
        connect_timeout_seconds: 20
